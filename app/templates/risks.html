{% extends 'base.html' %}{% block content %}
<div class='row g-4'><div class='col-lg-4'><div class='card'><div class='card-body'><h3>Log risk</h3><form method='post'>
<input class='form-control mb-2' name='title' placeholder='Risk title' required>
<select class='form-select mb-2' name='severity'><option>Low</option><option>Medium</option><option>High</option></select>
<input class='form-control mb-2' name='owner' placeholder='Owner' value='{{ current_user.name }}' required>
<textarea class='form-control mb-2' name='mitigation' placeholder='Mitigation' required></textarea>
<select class='form-select mb-2' name='status'><option>open</option><option>monitoring</option><option>closed</option></select>
<button class='btn btn-dark'>Save risk</button></form></div></div></div>
<div class='col-lg-8'><div class='card'><div class='card-body'><h3>Risk register</h3>
<form method='get' class='d-flex gap-2 mb-3 flex-wrap'>
  <input class='form-control form-control-sm' style='max-width:220px' name='q' value='{{ q }}' placeholder='Search title, owner…'>
  <select class='form-select form-select-sm' style='max-width:140px' name='severity'>
    <option value=''>All severities</option>
    <option value='High' {% if severity=='High' %}selected{% endif %}>High</option>
    <option value='Medium' {% if severity=='Medium' %}selected{% endif %}>Medium</option>
    <option value='Low' {% if severity=='Low' %}selected{% endif %}>Low</option>
  </select>
  <select class='form-select form-select-sm' style='max-width:140px' name='status'>
    <option value=''>All statuses</option>
    <option value='open' {% if status=='open' %}selected{% endif %}>Open</option>
    <option value='monitoring' {% if status=='monitoring' %}selected{% endif %}>Monitoring</option>
    <option value='closed' {% if status=='closed' %}selected{% endif %}>Closed</option>
  </select>
  <button class='btn btn-sm btn-outline-secondary'>Filter</button>
  {% if q or status or severity %}<a class='btn btn-sm btn-outline-secondary' href='{{ url_for("risks") }}'>Clear</a>{% endif %}
</form>
<table class='table table-striped linked-row'><tr><th>Risk</th><th>Severity</th><th>Owner</th><th>Status</th></tr>
{% for r in risks %}<tr><td><a class='primary-link' href='{{ url_for("record_detail", kind="risks", record_id=r.id) }}'>{{ r.title }}</a></td><td>{{ r.severity }}</td><td>{{ r.owner }}</td><td>{{ r.status }}</td></tr>
{% else %}<tr><td colspan='4'>No risks found.</td></tr>{% endfor %}
</table></div></div></div></div>{% endblock %}

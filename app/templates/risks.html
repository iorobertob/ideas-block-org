{% extends 'base.html' %}
{% block content %}
<div class="row g-4"><div class="col-lg-4"><div class="card"><div class="card-body"><h3>Log risk</h3><form method="post">
<input class="form-control mb-2" name="title" placeholder="Risk title" required>
<select class="form-select mb-2" name="severity"><option>Low</option><option>Medium</option><option>High</option></select>
<input class="form-control mb-2" name="owner" placeholder="Owner" required>
<textarea class="form-control mb-2" name="mitigation" placeholder="Mitigation" required></textarea>
<select class="form-select mb-2" name="status"><option>open</option><option>monitoring</option><option>closed</option></select>
<button class="btn btn-dark">Save risk</button></form></div></div></div>
<div class="col-lg-8"><div class="card"><div class="card-body"><h3>Risk register</h3><table class="table table-striped"><tr><th>Risk</th><th>Severity</th><th>Owner</th><th>Status</th><th>Mitigation</th></tr>{% for r in risks %}<tr><td>{{ r.title }}</td><td>{{ r.severity }}</td><td>{{ r.owner }}</td><td>{{ r.status }}</td><td>{{ r.mitigation }}</td></tr>{% endfor %}</table></div></div></div></div>
{% endblock %}

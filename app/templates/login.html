{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h2 class="mb-3">Login</h2>
        <p class="small-muted">Demo accounts: admin@example.com / admin123, director@example.com / director123</p>
        <form method="post">
          <div class="mb-3"><label class="form-label">Email</label><input class="form-control" name="email" required></div>
          <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
          <button class="btn btn-dark w-100">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

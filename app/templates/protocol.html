{% extends 'base.html' %}{% block content %}
<div class='row g-4'><div class='col-lg-4'><div class='card'><div class='card-body'><h3>Add protocol rule</h3><form method='post'>
<input class='form-control mb-2' name='principle' placeholder='Principle' required>
<textarea class='form-control mb-2' name='description' placeholder='Description' required></textarea>
<textarea class='form-control mb-2' name='implementation' placeholder='Implementation'></textarea>
<button class='btn btn-dark'>Save rule</button></form></div></div></div>
<div class='col-lg-8'><div class='card'><div class='card-body'><h3>Kompresorinė Protocol</h3><table class='table table-striped linked-row'><tr><th>Principle</th><th>Description</th></tr>{% for r in rules %}<tr><td><a class='primary-link' href='{{ url_for("record_detail", kind="protocol", record_id=r.id) }}'>{{ r.principle }}</a></td><td>{{ r.description }}</td></tr>{% endfor %}</table><hr><h4>Linked policies</h4><ul>{% for p in policies %}<li><a href='{{ url_for("record_detail", kind="policies", record_id=p.id) }}'>{{ p.title }}</a> ({{ p.category }})</li>{% endfor %}</ul></div></div></div></div>
{% endblock %}

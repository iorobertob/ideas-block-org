{% extends 'base.html' %}{% block content %}
<div class='row g-4'>
<div class='col-lg-4'><div class='card'><div class='card-body'><h3>Add user</h3>{% if current_user.role in ['admin','director','coordinator'] %}<form method='post'>
<div class='mb-2'><input class='form-control' name='name' placeholder='Name' required></div>
<div class='mb-2'><input class='form-control' name='email' type='email' placeholder='Email' required></div>
<div class='mb-2'><input class='form-control' name='password' type='password' placeholder='Password' required></div>
<div class='mb-2'><select class='form-select' name='role'><option>member</option><option>coordinator</option><option>director</option><option>admin</option></select></div>
<button class='btn btn-dark'>Create</button></form>{% else %}<p class='mb-0'>Only managers can create users.</p>{% endif %}</div></div></div>
<div class='col-lg-8'><div class='card'><div class='card-body'><h3>Users</h3><table class='table table-striped linked-row'><tr><th>Name</th><th>Email</th><th>Role</th></tr>{% for u in users %}<tr><td><a class='primary-link' href='{{ url_for("record_detail", kind="users", record_id=u.id) }}'>{{ u.name }}</a></td><td>{{ u.email }}</td><td>{{ u.role }}</td></tr>{% endfor %}</table></div></div></div>
</div>{% endblock %}
